<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="common-head">
        <meta charset="UTF-8">
        <!--<title>templates</title>-->
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <link rel="apple-touch-icon" href="/favicon.ico">
        <link rel="mask-icon" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .status-bar {
            padding: 10px 0;
            font-size: 14px;
            font-weight: 500;
        }
        .status-bar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-info {
            display: flex;
            gap: 20px;
        }
    </style>
</th:block>
<body>
<div th:fragment="top_info">

    <!-- Guest Status Bar -->
    <div class="status-bar bg-warning text-dark" th:if="${!auth.isAuthed() and quota.remaining!=0}">
        <div class="container">
            <div>You are browsing in guest mode</div>
            <div class="status-info">
                <span><strong>IP:</strong> <span th:text="${quota.ip}"></span></span>
                <span><strong>Remaining quota:</strong> <span th:text="${quota.remaining}"></span></span>
                <a th:href="@{/auth}" class="btn btn-primary btn-sm">Login</a>
            </div>
        </div>
    </div>

    <!-- Admin Status Bar -->

    <div class="status-bar bg-success text-white" th:if="${auth.isAuthed()}">
        <div class="container">
            <div>You are logged in as admin, Welcome!</div>
            <div class="status-info">
                <span><strong>IP:</strong> <span th:text="${quota.ip}"></span></span>
                <span><strong>Remaining quota:</strong> <span th:text="${quota.remaining}"></span></span>
                <a th:href="@{/logout}" class="btn btn-light btn-sm">Logout</a>
            </div>
        </div>
    </div>

    <!--<div align="center" th:if="${!auth.isAuthed() and quota.remaining!=0}" style="background-color: orange">
        You are browsing in guest mode.
        <br>
        <div th:text="'IP: ' + ${quota.ip} + ', quota: ' + ${quota.remaining}"></div>
    </div>

    <div align="center" th:if="${auth.isAuthed()}" style="background-color: green">
        You are logged in as admin, Welcome! <br>
        <div th:text="'For test purpose, IP: ' + ${quota.ip} + ', quota: ' + ${quota.remaining}"></div>
    </div>-->

    <div align="center" th:if="${!auth.isAuthed() and quota.remaining==0}" style="background-color: red">
        You are not logged in as an admin, and you have reached the daily limit for access.
        <div th:text="'IP: ' + ${quota.ip} + ', quota: ' + ${quota.remaining}"></div>
    </div>
</div>
</body>
</html>
