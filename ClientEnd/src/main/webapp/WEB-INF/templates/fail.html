<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:insert="templates :: common-head"></th:block>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div th:insert="templates :: top_info"></div>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Error</h2>
          <div class="alert alert-danger" role="alert">
            <pre class="mb-0" style="white-space: pre-wrap;" th:utext="${msg}"></pre>
          </div>
          <div class="d-grid gap-2 mt-4">
            <a th:href="@{/}" class="btn btn-primary">Return to Index</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
