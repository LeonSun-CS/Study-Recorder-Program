    <div class="container mt-5">
        <!--        <h3 class="text-center mb-4">My Notes</h3>-->

        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Filter content</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/notes}" method="GET">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="term" class="form-label">Term:</label>
                            <select name="term" id="term" class="form-select">
                                <option th:each="term : ${terms}" th:text="${term.name}" th:value="${term.id}"
                                        th:selected="${term.id == placeholderTermId}"></option>
                                <option value="0" th:selected="${placeholderTermId == 0}">*</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="course" class="form-label">Course:</label>
                            <select name="course" id="course" class="form-select">
                                <option th:each="course : ${courses}" th:text="${course.name}" th:value="${course.id}"
                                        th:selected="${course.id == placeholderCourseId}"></option>
                                <option value="0" th:selected="${placeholderCourseId == 0}">*</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="start" class="form-label">Start date:</label>
                            <input name="start" type="date" id="start" class="form-control"
                                   th:value="${placeholderStart}">
                        </div>
                        <div class="col-md-6">
                            <label for="end" class="form-label">End date:</label>
                            <input name="end" type="date" id="end" class="form-control" th:value="${placeholderEnd}">
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">Filter</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <br>
    <br>
    <br>
    <div align="left"><a th:href="@{/}">Index page</a></div>
    <br>
    <a th:href="@{/notes/add}">Add note</a>
    <div class="container">
        <div class="table-wrapper">
            <table class="table table-striped table-hover">
                <thead>
                <tr>
                    <th class="index-column">Index</th>
                    <th class="term-column">Term</th>
                    <th class="course-column">Course</th>
                    <th class="creation-time-column">Time Created</th>
                    <th class="content-column">Content</th>
                    <th class="file-column">Linked File</th>
                    <th class="update-time-column">Time Updated</th>
                    <th class="action-column">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="note, stat : ${notes}">
                    <td th:text="${stat.index} + 1"/>
                    <td th:text="${note.course.term.name}"/>
                    <td th:text="${note.course.name}"/>
                    <td th:text="${note.timeAdded}"/>
                    <td>
                        <div class="note-content" style="white-space: pre-line; text-align: left">
                            <span class="short-content" th:utext="${#strings.abbreviate(note.content, 200)}"></span>
                            <span class="full-content" style="display: none;" th:utext="${note.content}"></span>
                            <a href="#" class="read-more" th:if="${#strings.length(note.content) > 200}">Read More</a>
                        </div>
                    </td>

                    <td>
                        <a th:if="${note.fileName != null}"
                           th:href="@{/files/{cid}/{fn}(cid=${note.course.id},fn=${note.fileName})}">Click to view
                            <span th:text="${#strings.toUpperCase(#strings.arraySplit(note.fileName, '.')[1])}"> </span>
                            file
                        </a>
                        <span th:if="${note.fileName == null}">No file uploaded for this note</span>
                    </td>
                    <td th:text="${note.timeUpdated}"/>
                    <td>
                        <!--            <a th:href="@{/notes/edit/}+${note.id}">Edit</a>-->
                        <!--            <a onclick="delFunc(event)" th:attr="did=${note.id}">Delete</a>-->

                        <a style="margin: 10px 10px;" th:href="@{/note/{noteId}(noteId=${note.id})}" class="btn btn-info btn-sm">View</a>
                        <a style="margin: 10px 10px;" th:href="@{/notes/edit/}+${note.id}"
                           class="btn btn-primary btn-sm"  th:if="${auth.isAuthed()}">Edit</a>
                        <button style="margin: 10px 10px;" class="btn btn-danger btn-sm delete-btn"
                                th:attr="data-id=${note.id}"  th:if="${auth.isAuthed()}">Delete
                        </button>

                        <!--<form th:id="delForm + ${note.id}" th:action="@{/notes}" method="post">
                            <input name="id" th:value="${note.id}" hidden="hidden"/>
                            <input name="_method" value="DELETE" hidden="hidden"/>
                        </form>-->
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

    <br>
    <br>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const readMoreLinks = document.querySelectorAll('.read-more');

        readMoreLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const contentDiv = this.closest('.note-content');
                const shortContent = contentDiv.querySelector('.short-content');
                const fullContent = contentDiv.querySelector('.full-content');

                if (shortContent.style.display !== 'none') {
                    shortContent.style.display = 'none';
                    fullContent.style.display = 'inline';
                    this.textContent = 'Read Less';

                    // Render MathJax for the full content
                    MathJax.typesetPromise([fullContent]).then(() => {
                        // MathJax rendering is complete
                    });
                } else {
                    shortContent.style.display = 'inline';
                    fullContent.style.display = 'none';
                    this.textContent = 'Read More';
                }
            });
        });
    });
</script>

</body>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script th:if="${auth.isAuthed()}">
    $(document).ready(function () {
        $('.delete-btn').click(function () {
            var button = $(this);
            var noteId = button.data('id');

            if (confirm('Are you sure you want to delete this note?')) {
                $.ajax({
                        url: "/notes",
                        type: "POST",
                        data: {
                            id: noteId,
                            _method: "DELETE"
                        },
                        success: function (response) {
                            if (response && response.response === "success") {
                                button.closest('tr').remove();
                            } else {
                                alert('Failed to delete note: ' + response.response);
                            }
                        },
                        error: function (error) {
                            alert('An error occurred while deleting: ' + error);
                        }

                    }
                )
            }
        });
    });
</script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        const termSelect = document.getElementById('term');
        const courseSelect = document.getElementById('course');
        const startDate = document.getElementById('start');

        // Function to fetch courses and update the course select
        async function updateCourses(termId) {
            const fetchUrl = /*[[@{/courses-in-term/}]]*/ '/defaultUrl/';
            // const response = await fetch(`https://localhost:8080/courses-in-term/${termId}`);
            const response = await fetch(fetchUrl + `${termId}`);
            const courseText = await response.text();
            const jsonData = JSON.parse(courseText);
            try {

                // Clear existing options
                courseSelect.innerHTML = '';

                let runner = 0;
                // Add new options
                jsonData.courses.forEach(course => {
                    const option = document.createElement('option');
                    if (runner === 0) {
                        option.selected = true;
                        runner++;
                    }
                    option.value = course.id;
                    option.textContent = course.name;
                    courseSelect.appendChild(option);
                });
                const option = document.createElement('option');
                option.value = 0;
                option.textContent = '*';
                courseSelect.appendChild(option);
            } catch (error) {
                console.error('Error fetching courses:', error);
            }
            //     update start date
            startDate.value = jsonData['start-date'];
        }
        /*

                // Initial load of courses for the default selected term
                updateCourses(termSelect.value);
        */

        // Add event listener for term change
        termSelect.addEventListener('change', function () {
            updateCourses(this.value);
        });
    });
</script>
