<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="templates :: common-head"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a new course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div th:insert="templates :: top_info"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Add Course</h2>
                    <form th:action="@{/course}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="cid" class="form-label">Term:</label>
                            <select id="cid" name="term" class="form-select">
                                <option th:each="term : ${terms}" th:value="${term.id}" th:text="${term.name}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="title" class="form-label">Course title:</label>
                            <input id="title" type="text" class="form-control" name="name">
                        </div>
                        <div class="mb-3">
                            <label for="desc" class="form-label">Course description:</label>
                            <textarea id="desc" rows="5" class="form-control" name="desc"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">In progress:</label>
                            <div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" id="inp-true" name="inp" value="1">
                                    <label class="form-check-label" for="inp-true">True</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" id="inp-false" name="inp" value="0" checked="checked">
                                    <label class="form-check-label" for="inp-false">False</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Major related:</label>
                            <div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" id="mr-true" name="mr" value="1">
                                    <label class="form-check-label" for="mr-true">True</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" id="mr-false" name="mr" value="0">
                                    <label class="form-check-label" for="mr-false">False</label>
                                </div>
                            </div>
                        </div>
                        <input hidden="hidden" name="_method" value="POST">
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Add Course</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
