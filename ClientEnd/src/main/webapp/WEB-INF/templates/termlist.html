<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="templates :: common-head"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Term List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">
<div th:insert="templates :: top_info"></div>

<div class="container mt-5">
    <h1 class="text-center mb-4">Terms</h1>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>Index</th>
            <th>Term</th>
            <th>Start Date</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="term, stat : ${terms}">
            <td th:text="${stat.index} + 1"/>
            <td th:text="${term.name}"/>
            <td th:text="${#dates.format(term.startDate, 'yyyy-MM-dd')}"/>
            <td>
                <a th:href="@{/term_edit/} + ${term.id}" class="btn btn-primary btn-sm">Edit</a>
                <button class="btn btn-danger btn-sm delete-btn" th:attr="data-id=${term.id}">Delete</button>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="text-center mt-4">
        <a th:href="@{/term/addition}" class="btn btn-success">Add new term</a>
    </div>
</div>

<div class="text-center mt-3">
    <a th:href="@{/}" class="btn btn-secondary">Index page</a>
</div>

<script>
    $(document).ready(function () {
        $('.delete-btn').click(function () {
            var button = $(this);
            var id = button.data('id');

            $.ajax({
                url: '/term',
                type: 'POST',
                data: {
                    id: id,
                    _method: 'DELETE'
                },
                success: function (response) {
                    if (response && response.response === "success") {
                        button.closest('tr').remove();
                    } else {
                        alert('Failed to delete term: ' + response.response);
                    }
                },
                error: function (error) {
                    alert('An error occurred while deleting: ' + error);
                }
            });
        });
    });
</script>
</body>
</html>
