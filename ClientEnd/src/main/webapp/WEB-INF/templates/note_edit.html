<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="templates :: common-head"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div th:insert="templates :: top_info"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Edit note</h2>
                    <p class="text-center text-danger"><strong><em>Delete the file first before changing the course category</em></strong>, if there is an associated file to this note.</p>
                    <form th:action="@{/notes}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="cid" class="form-label">Course:</label>
                            <select id="cid" name="cid" class="form-select">
                                <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.name}" th:selected="${note.course.id == course.id}"/>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="content" class="form-label">Content:</label>
                            <textarea rows="5" id="content" name="content" class="form-control" placeholder="Type in what you learned today" th:field="${note.content}"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="file" class="form-label">File (optional):</label>
                            <input id="file" name="file" type="file" class="form-control"/>
                            <a th:if="${note.fileName != null}" href="#" th:attr="nid=${note.id}" onclick="delFunc()" class="btn btn-link">Delete the current file</a>
                        </div>
                        <input hidden="hidden" name="noteid" th:value="${note.id}">
                        <div class="mb-3">
                            <fieldset>
                                <legend class="form-label">Deletable:</legend>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="deletable" value="1" id="deletableTrue">
                                    <label class="form-check-label" for="deletableTrue">True</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="deletable" value="0" id="deletableFalse" checked>
                                    <label class="form-check-label" for="deletableFalse">False</label>
                                </div>
                            </fieldset>
                        </div>
                        <input hidden="hidden" name="_method" value="PUT">
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Update Note</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<form id="delForm" th:action="@{/file}" method="post" style="display: none;">
    <input hidden="hidden" name="fName" th:value="${note.course.id}+'/'+${note.fileName}" />
    <input hidden="hidden" name="forNote" th:value="${note.id}">
    <input hidden="hidden" name="_method" value="DELETE">
</form>

<div class="text-center mt-4">
    <a th:href="@{/}" class="btn btn-secondary">Index page</a>
</div>

<script>
    function delFunc(){
        document.getElementById("delForm").submit();
    }
</script>
</body>
</html>
