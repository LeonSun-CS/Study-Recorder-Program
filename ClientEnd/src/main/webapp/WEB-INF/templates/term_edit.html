<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="templates :: common-head"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Term Edit Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div th:insert="templates :: top_info"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Edit Term</h2>
                    <form th:action="@{/term}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name:</label>
                            <input id="name" name="name" type="text" class="form-control" th:value="${term.name}" placeholder="yyyySemester" required>
                        </div>
                        <div class="mb-3">
                            <label for="date" class="form-label">Start Date:</label>
                            <input type="date" id="date" name="date" class="form-control" th:value="${#dates.format(term.startDate, 'yyyy-MM-dd')}" required>
                        </div>
                        <input name="id" type="hidden" th:value="${term.id}">
                        <div class="mb-3">
                            <fieldset>
                                <legend class="form-label">Deletable:</legend>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" id="deletableTrue" name="deletable" value="1">
                                    <label class="form-check-label" for="deletableTrue">True</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" id="deletableFalse" name="deletable" value="0" checked>
                                    <label class="form-check-label" for="deletableFalse">False</label>
                                </div>
                            </fieldset>
                        </div>
                        <input type="hidden" name="_method" value="PUT">
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Update Term</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="text-center mt-4">
    <a th:href="@{/}" class="btn btn-secondary">Index page</a>
</div>
</body>
</html>
