<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="templates :: common-head"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">
<div th:insert="templates :: top_info"></div>

<div class="container mt-5">
    <h1 class="text-center mb-4">Courses</h1>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>Index</th>
            <th>Course Name</th>
            <th>Description</th>
            <th>Term</th>
            <th>In Progress</th>
            <th>Major Related</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course, stat : ${courses}">
            <td th:text="${stat.index} + 1"/>
            <td th:text="${course.name}"/>
            <td th:text="${course.description}"/>
            <td th:text="${course.term.name}"/>
            <td th:text="${course.inProgress}"/>
            <td th:text="${course.majorRelated}"/>
            <td>
                <a style="margin: 10px 10px;" th:href="@{/course_edit/} + ${course.id}" class="btn btn-primary btn-sm">Edit</a>
                <button style="margin: 10px 10px;" class="btn btn-danger btn-sm delete-btn"
                        th:attr="data-id=${course.id}">Delete
                </button>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="text-center mt-4">
        <a th:href="@{/course/addition}" class="btn btn-success">Add new course</a>
    </div>
</div>

<div class="text-center mt-3">
    <a th:href="@{/}" class="btn btn-secondary">Index page</a>
</div>

<script>
    $(document).ready(function () {
        $('.delete-btn').click(function () {
            var button = $(this);
            var courseId = button.data('id');

            if (confirm('Are you sure you want to delete this course?')) {
                $.ajax({
                    url: '/course',
                    type: 'POST',
                    data: {
                        id: courseId,
                        _method: 'DELETE'
                    },
                    success: function (response) {
                        if (response && response.response === "success") {
                            button.closest('tr').remove();
                        } else {
                            alert('Failed to delete course: ' + response.response);
                        }
                    },
                    error: function (xhr, status, error) {
                        alert('Error deleting course: ' + error);
                    }
                });
            }
        });
    });
</script>
</body>
</html>
