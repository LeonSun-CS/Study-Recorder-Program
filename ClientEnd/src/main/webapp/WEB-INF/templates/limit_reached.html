<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="templates :: common-head"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limit Reached</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body class="bg-light">
<div th:insert="templates :: top_info"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <h1 th:if="${!auth.authed}" class="card-title text-center mb-4">Access Limit Reached</h1>
                    <h1 th:if="${auth.authed}" class="card-title text-center mb-4">Session Status</h1>
                    <div th:if="${!auth.authed}" class="alert alert-warning" role="alert">
                        Sorry, you have reached the limit to access the site.
                    </div>
                    <div th:if="${auth.authed}" class="alert alert-warning" role="alert">
                        Welcome, admin!
                    </div>
                    <div class="mb-3">
                        <h5>Quota Information:</h5>
                        <p>Remaining quota: <strong th:text="${quota.remaining}"></strong> for IP: <strong th:text="${quota.ip}"></strong></p>
                    </div>
                    <div class="mb-3">
                        <h5>Authentication Status:</h5>
                        <p>
                            Status:
                            <span th:if="${auth.authed}" class="badge bg-success">Authenticated</span>
                            <span th:if="${!auth.authed}" class="badge bg-danger">Unauthenticated</span>
                        </p>
                        <p>Session ID: <strong th:text="${auth.sessionId}"></strong></p>
                    </div>
                    <div class="d-grid gap-2">
                        <a th:if="${!auth.authed}" th:href="@{/auth}" class="btn btn-primary">Admin Log In</a>
                        <a th:if="${auth.authed}" th:href="@{/}" class="btn btn-primary">Index</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
