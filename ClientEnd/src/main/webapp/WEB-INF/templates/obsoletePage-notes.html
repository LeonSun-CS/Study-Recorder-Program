<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:insert="templates :: common-head"></th:block>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

  <title>Notes</title>
  <!--  Prism plugin-->
  <link rel="stylesheet" href="static/css/prism.css">
  <script src="static/js/prism.js"></script>

  <!--  LaTex plugin-->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3.0.1/es5/tex-mml-chtml.js"></script>
  <script type="text/javascript">
    MathJax = {
      tex: {
        inlineMath: [
          ['$', '$'],
          ['\\(', '\\)']
        ],
        displayMath: [
          ['$$', '$$']
        ],
        processEscapes: true
      },
    };
  </script>
</head>
<body>
<div th:insert="templates :: top_info"></div>


<h1 align="center">My notes</h1>
<div align="center">
  <div>filter</div>
  <br>
  <form id="queryForm" th:action="@{/notes}" method="GET">
    <label for="term">Term: </label>
    <select name="term" id="term">
      <option th:each="term : ${terms}" th:text="${term.name}" th:value="${term.id}"></option>
    </select>

    <label for="course">Course: </label>
    <select name="course" id="course">
      <option th:each="course : ${courses}" th:text="${course.name}" th:value="${course.id}"></option>
    </select>
    <label for="start">Start date:</label>
    <input name="start" type="date" id="start">
    <label for="end">End date:</label>
    <input name="end" type="date" id="end">
<!--    <input hidden="hidden" name="_method" value="GET">-->
    <br>
    <br>
    <div id="ts">
<!--    <div class="cf-turnstile" data-sitekey="0x4AAAAAAAYlvEDpt3eHdtWz" data-callback="javascriptCallback" data-theme="light">-->
    </div>
    <br>
    <input onclick="smt(event)" type="submit">
  </form>
  <br>
  <br>
  <br>
  <div align="left"><a th:href="@{/}">Index page</a></div>
  <br>
  <a th:href="@{/notes_admin/add}">Add note</a>
  <table width="1400px" border="1" style="border-style: solid">
    <tr>
      <th>Index</th>
      <th>Term</th>
      <th>Course Name</th>
      <th>Time Created</th>
      <th>Content</th>
      <th>Linked File</th>
      <th>Time Updated</th>
    </tr>
    <tr th:each="note, stat : ${notes}">
      <td th:text="${stat.index} + 1" />
      <td th:text="${note.course.term.name}" />
      <td th:text="${note.course.name}" />
      <td th:text="${note.timeAdded}" />
<!--      <td th:text="${note.content}" />-->
      <td><div style="white-space: pre-line" th:utext="${note.content}" ></div> </td>

      <td>
        <a th:if="${note.fileName != null}" th:href="@{/files/{cid}/{fn}(cid=${note.course.id},fn=${note.fileName})}">Click to view
          <span th:text="${#strings.toUpperCase(#strings.arraySplit(note.fileName, '.')[1])}"> </span> file
        </a>
        <span th:if="${note.fileName == null}">No file uploaded for this note</span>
      </td>
      <td th:text="${note.timeUpdated}" />
    </tr>
  </table>
  <a th:href="@{/}">Index page</a>

</div>
</body>
<script>
  function smt(event) {
    event.preventDefault();
    var queryForm = document.getElementById("queryForm");
    turnstile.render('#ts', {
      sitekey: '0x4AAAAAAAYlvEDpt3eHdtWz',
      callback: function(token) {
        console.log(`Challenge Success ${token}`);
        queryForm.submit();
      },
    });
  }
</script>
</html>
