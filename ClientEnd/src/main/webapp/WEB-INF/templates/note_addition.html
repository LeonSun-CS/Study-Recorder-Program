<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="templates :: common-head"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a new note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div th:insert="templates :: top_info"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Add Note</h2>
                    <form th:action="@{/notes}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="cid" class="form-label">Course:</label>
                            <select id="cid" name="cid" class="form-select">
                                <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.name}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="content" class="form-label">Content:</label>
                            <textarea id="content" rows="5" class="form-control" name="content" placeholder="Type in what you learned today"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="file" class="form-label">File (optional):</label>
                            <input id="file" name="file" type="file" class="form-control">
                        </div>
                        <input hidden="hidden" name="_method" value="POST">
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Add Note</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
