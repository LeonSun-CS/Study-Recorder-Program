<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="templates :: common-head"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://www.leon-sun.com/static/css/prism.css">
    <script src="https://www.leon-sun.com/static/js/prism.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3.0.1/es5/tex-mml-chtml.js"></script>
    <script th:inline="none" type="text/javascript">
        /*<![CDATA[*/
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\$', '\$']],
                displayMath: [['$$', '$$'], ['\$$', '\$$']],
                processEscapes: true
            },
        };
        /*]]>*/
    </script>
</head>
<body class="bg-light">
<div th:insert="templates :: top_info"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h2 class="card-title mb-0">Note Details</h2>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <strong>Term:</strong>
                        <span th:text="${note.course.term.name}"></span>
                    </div>
                    <div class="mb-3">
                        <strong>Course:</strong>
                        <span th:text="${note.course.name}"></span>
                    </div>
                    <div class="mb-3">
                        <strong>Created:</strong>
                        <span th:text="${note.timeAdded}"></span>
                    </div>
                    <div class="mb-3">
                        <strong>Last Updated:</strong>
                        <span th:text="${note.timeUpdated}"></span>
                    </div>
                    <div class="mb-3">
                        <strong>Content:</strong>
                        <div class="note-content" style="white-space: pre-line; text-align: left" th:utext="${note.content}"></div>
                    </div>
                    <div class="mb-3">
                        <strong>Linked File:</strong>
                        <div th:if="${note.fileName != null}">
                            <a th:href="@{/files/{cid}/{fn}(cid=${note.course.id},fn=${note.fileName})}">
                                View <span th:text="${#strings.toUpperCase(#strings.arraySplit(note.fileName, '.')[1])}"></span> file
                            </a>
                        </div>
                        <div th:if="${note.fileName == null}">No file uploaded for this note</div>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/notes}" class="btn btn-secondary">Back to Notes</a>
                        <div th:if="${auth.isAuthed()}">
                            <a th:href="@{/notes/edit/}+${note.id}" class="btn btn-primary me-2">Edit</a>
                            <button class="btn btn-danger delete-btn" th:attr="data-id=${note.id}">Delete</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script th:if="${auth.isAuthed()}">
    $(document).ready(function () {
        $('.delete-btn').click(function () {
            var button = $(this);
            var noteId = button.data('id');

            if (confirm('Are you sure you want to delete this note?')) {
                $.ajax({
                    url: "/notes",
                    type: "POST",
                    data: {
                        id: noteId,
                        _method: "DELETE"
                    },
                    success: function (response) {
                        if (response && response.response === "success") {
                            window.location.href = '/notes';
                        } else {
                            alert('Failed to delete note: ' + response.response);
                        }
                    },
                    error: function (error) {
                        alert('An error occurred while deleting: ' + error);
                    }
                });
            }
        });
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        MathJax.typesetPromise([document.querySelector('.note-content')]).then(() => {
            // MathJax rendering is complete
        });
    });
</script>
</body>
</html>
